# Wall materials and device families. The material enters through the geometry (thickness, edge radius,
# transition), through a Winkler wall stiffness E/((1 - nu^2) l) in series with the contact penalty, and
# through the hydraulics. Adhesion, friction and channel compliance under pressure are not modelled.
version: 1
materials:
  PC:   {name: polycarbonate, E_GPa: {nominal: 2.3, range: [2.0, 2.6]}, nu: 0.37, source: "Chantiwas et al. 2011, doi:10.1039/c0cs00138d"}
  PET:  {name: poly(ethylene terephthalate), E_GPa: {nominal: 2.35, range: [2.0, 2.7]}, nu: 0.40, source: "Chantiwas et al. 2011"}
  PMMA: {name: poly(methyl methacrylate), E_GPa: {nominal: 2.9, range: [1.8, 3.4]}, nu: 0.37, source: "Chantiwas et al. 2011"}
  PDMS: {name: "polydimethylsiloxane (Sylgard 184, 10:1)", E_GPa: {nominal: 0.00200, range: [0.00132, 0.00297]}, nu: 0.49, source: "Johnston et al. 2014, doi:10.1088/0960-1317/24/3/035017"}
# Every device uses the even analytic wall profile of src/ctcfem/geometry.py, which reaches the declared
# aperture radius exactly at the neck. Membrane: zt = thickness/2, L = edge radius. Channel: zt = throat
# half-length, L = transition length.
devices:
  membrane_PC:   {type: membrane, material: PC,   fabrication: track-etched, thickness_um: {nominal: 10.0, range: [7.0, 25.0], status: declared}, edge_radius_um: {nominal: 1.0, range: [0.5, 2.0], status: declared}, pore_density_cm2: {nominal: 1.0e5, status: declared}, R_ext_um: 25.0}
  membrane_PET:  {type: membrane, material: PET,  fabrication: track-etched, thickness_um: {nominal: 12.0, range: [10.0, 25.0], status: declared}, edge_radius_um: {nominal: 1.0, range: [0.5, 2.0], status: declared}, pore_density_cm2: {nominal: 6.0e4, status: measured, source: "Millicell PET 8 um"}, R_ext_um: 25.0}
  membrane_PDMS: {type: membrane, material: PDMS, fabrication: soft lithography, thickness_um: {nominal: 20.0, range: [10.0, 50.0], status: declared}, edge_radius_um: {nominal: 2.0, range: [1.0, 4.0], status: declared}, pore_density_cm2: {nominal: 1.0e5, status: declared}, R_ext_um: 25.0}
  channel_PDMS:  {type: channel, material: PDMS, fabrication: soft lithography, throat_half_length_um: {nominal: 5.0, range: [2.0, 10.0], status: declared}, transition_um: {nominal: 5.0, range: [2.5, 12.0], status: declared}, R_ext_um: 15.0}
  channel_PMMA:  {type: channel, material: PMMA, fabrication: micromilling or hot embossing, throat_half_length_um: {nominal: 5.0, range: [2.0, 10.0], status: declared}, transition_um: {nominal: 10.0, range: [5.0, 20.0], status: declared}, R_ext_um: 15.0}
