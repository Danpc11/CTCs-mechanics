# Production run: apertures from 5 to 15 um every 0.5 um, with 8, 10 and 12 um included explicitly.
seed: 20261015                   # do not change between restarts
output: results/full
data: {populations: data/populations.yaml, materials: data/materials.yaml}
populations: {neutrophil: 96, lymphocyte: 64, monocyte: 64, eosinophil: 32, basophil: 16, MCF-7: 96, MDA-MB-231: 96, SK-BR-3: 64, patient_breast_CTC: 96, HL-60: 48, Jurkat: 48}
devices: [membrane_PC, membrane_PET, membrane_PDMS, channel_PDMS, channel_PMMA]
apertures_um: {start: 5.0, stop: 15.0, step: 0.5, extra: [8.0, 10.0, 12.0]}
model: {hrel: 10.0, kn_f: 200.0, conf_max_attempt: 2.4, use_gamma: false, compliant_wall: true}          # conf_max_attempt: continuation is attempted up to a/R = 2.4; assessed range is a/R <= 1.636
reduction: {l_factor: 1.0}
execution:
  workers: 20                 # override with --workers
  tasks_per_child: 25
  task_timeout_s: 3600        # a slower task is recorded as an error and skipped
  memory_limit_gb: 4.0        # per worker (RLIMIT_DATA); the heaviest task measured uses ~0.2 GB
  memory_per_task_gb: 1.0     # used to cap workers by available memory
  memory_reserve_gb: 8.0      # memory never assigned to workers
  min_free_memory_gb: 8.0     # below this, submission pauses
  nice: 0
