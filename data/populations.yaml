# Cell populations: marginal distribution of each parameter.
#   dist: normal | lognormal | fixed;  mean and sd (or cv);  trunc: [min, max]
#   status: measured (in that population) | transferred (measured in another population) | declared | derived
# Units: diameters in um, E_app in kPa, cortical tension gamma in mN/m (= 1000 pN/um), viscosity in Pa s, tau in s.
# This file is an input: changing it changes the hash recorded in manifest.json.
version: 1

# Leucocyte differential of healthy donors (analysis weights). Chavez-Gonzalez et al. 2023, doi:10.11613/bm.2023.020701
differential: {neutrophil: 0.5635, lymphocyte: 0.3286, monocyte: 0.0804, eosinophil: 0.0209, basophil: 0.0066}

model:
  K_E: 2.608        # E_app = K_E Gs / a (cortex calibration with Pi = 0.10)
  Pi: 0.10          # G_cyt a / Gs (declared regularisation)
  C_skalak: 10.0    # Skalak parameter, Ks = (1 + 2C) Gs; transferred (Wang et al. 2023); range 2.4-37
  r_nuc: 2.0        # nucleus/cytoplasm stiffness; transferred; range 1.4-4
  r_env: 2.0        # envelope Gs / cortex Gs; transferred; range 2-8

populations:
  neutrophil:
    group: leucocyte
    D:     {dist: normal, mean: 8.40, sd: 0.60, trunc: [6.5, 10.5], status: measured, source: "Coulter 8.4 um (Downey et al. 1990, doi:10.1152/jappl.1990.69.5.1767); SD 0.6 um (Rosenbluth et al. 2006, doi:10.1529/biophysj.105.067496)"}
    an_a:  {dist: normal, mean: 0.625, sd: 0.08, trunc: [0.45, 0.80], status: measured, source: "39 +/- 11% of cross-sectional area (Rosenbluth et al. 2006)"}
    E_app: {dist: lognormal, mean: 0.43, cv: 0.25, trunc: [0.15, 1.2], status: "measured (mean); declared (cv)", source: "granulocyte, dRT-DC 0.43 [0.38-0.48] kPa (Fregin et al. 2019, doi:10.1038/s41467-019-08370-3)"}
    gamma: {dist: normal, mean: 0.037, sd: 0.0048, trunc: [0.005, 0.08], status: measured, source: "37.0 +/- 4.8 pN/um, microfluidic aspiration at room temperature (Guo et al. 2012, doi:10.1039/c2lc40205j); much lower at 37 C"}
    eta:   {dist: lognormal, mean: 150.0, cv: 0.35, trunc: [50, 600], status: measured, source: "~100-200 Pa s, micropipette (Evans and Yeung 1989, doi:10.1016/S0006-3495(89)82660-8)"}
    tau:   {dist: lognormal, mean: 0.008575, cv: 0.5, trunc: [0.001, 3.23], status: transferred, source: "whole-cell HL-60 dRT-DC (Fregin et al. 2019)"}
  lymphocyte:
    group: leucocyte
    D:     {dist: normal, mean: 6.05, sd: 0.44, trunc: [4.8, 7.8], status: "measured (mean); transferred (sd)", source: "6.05 um (Downey et al. 1990); sd from the neutrophil CV of 7.2%"}
    an_a:  {dist: normal, mean: 0.763, sd: 0.05, trunc: [0.65, 0.88], status: measured, source: "nucleus 44.4% of volume (Schmid-Schonbein et al. 1980, doi:10.1182/blood.v56.5.866.866)"}
    E_app: {dist: lognormal, mean: 0.62, cv: 0.25, trunc: [0.2, 1.6], status: "measured (PBMC); declared (cv)", source: "PBMC dRT-DC 0.62 [0.58-0.66] kPa (Fregin et al. 2019)"}
    gamma: {dist: normal, mean: 0.0747, sd: 0.0098, trunc: [0.02, 0.15], status: measured, source: "74.7 +/- 9.8 pN/um, same technique as the neutrophil (Guo et al. 2012)"}
    eta:   {dist: lognormal, mean: 150.0, cv: 0.5, trunc: [30, 1500], status: transferred, source: "neutrophil; no value recovered for resting lymphocytes"}
    tau:   {dist: lognormal, mean: 0.008575, cv: 0.5, trunc: [0.001, 3.23], status: transferred, source: "as neutrophil"}
  monocyte:
    group: leucocyte
    D:     {dist: normal, mean: 8.79, sd: 0.57, trunc: [7.0, 11.0], status: measured, source: "Coulter 8.79 um, range 7.72-9.99 taken as +/-2 SD (Downey et al. 1990)"}
    an_a:  {dist: normal, mean: 0.638, sd: 0.06, trunc: [0.48, 0.80], status: measured, source: "nucleus 25.9% of volume (Schmid-Schonbein et al. 1980)"}
    E_app: {dist: lognormal, mean: 0.62, cv: 0.30, trunc: [0.2, 2.0], status: "transferred (PBMC); declared (cv)", source: "PBMC dRT-DC (Fregin et al. 2019); monocytes may be stiffer than T cells (Bufi et al. 2015, doi:10.1016/j.bpj.2015.03.047)"}
    gamma: {dist: normal, mean: 0.037, sd: 0.018, trunc: [0.005, 0.12], status: transferred, source: "neutrophil, sd 50%"}
    eta:   {dist: lognormal, mean: 150.0, cv: 0.5, trunc: [30, 1500], status: transferred, source: "neutrophil"}
    tau:   {dist: lognormal, mean: 0.008575, cv: 0.5, trunc: [0.001, 3.23], status: transferred, source: "neutrophil"}
  eosinophil:
    group: leucocyte
    D:     {dist: normal, mean: 8.40, sd: 0.60, trunc: [6.5, 10.5], status: transferred, source: "neutrophil"}
    an_a:  {dist: normal, mean: 0.625, sd: 0.08, trunc: [0.45, 0.80], status: transferred, source: "neutrophil"}
    E_app: {dist: lognormal, mean: 0.43, cv: 0.25, trunc: [0.15, 1.2], status: transferred, source: "granulocyte"}
    gamma: {dist: normal, mean: 0.037, sd: 0.0048, trunc: [0.005, 0.08], status: transferred, source: "neutrophil"}
    eta:   {dist: lognormal, mean: 150.0, cv: 0.35, trunc: [50, 600], status: transferred, source: "neutrophil"}
    tau:   {dist: lognormal, mean: 0.008575, cv: 0.5, trunc: [0.001, 3.23], status: transferred, source: "neutrophil"}
  basophil:
    group: leucocyte
    D:     {dist: normal, mean: 8.40, sd: 0.60, trunc: [6.5, 10.5], status: transferred, source: "neutrophil"}
    an_a:  {dist: normal, mean: 0.625, sd: 0.08, trunc: [0.45, 0.80], status: transferred, source: "neutrophil"}
    E_app: {dist: lognormal, mean: 0.43, cv: 0.25, trunc: [0.15, 1.2], status: transferred, source: "granulocyte"}
    gamma: {dist: normal, mean: 0.037, sd: 0.0048, trunc: [0.005, 0.08], status: transferred, source: "neutrophil"}
    eta:   {dist: lognormal, mean: 150.0, cv: 0.35, trunc: [50, 600], status: transferred, source: "neutrophil"}
    tau:   {dist: lognormal, mean: 0.008575, cv: 0.5, trunc: [0.001, 3.23], status: transferred, source: "neutrophil"}
  MCF-7:
    group: tumour
    D:     {dist: normal, mean: 17.48, cv: 0.10, trunc: [12.0, 24.0], status: "measured (mean); declared (cv)", source: "radius 8.74 um (Hu et al. 2018, doi:10.1039/c7ra10750a)"}
    an_a:  {dist: normal, mean: 0.50, sd: 0.05, trunc: [0.40, 0.60], status: transferred, source: "fits to HL-60, PC-3 and K-562 (Wang et al. 2023; Lu et al. 2025)"}
    E_app: {dist: lognormal, mean: 2.650, cv: 0.25, trunc: [0.8, 8.0], status: "measured (mean); declared (cv)", source: "acoustic tweezers (Lim et al. 2020, doi:10.1038/s41378-020-0150-6)"}
    gamma: {dist: fixed, value: 0.0, status: declared, source: "no measurement for breast lines"}
    eta:   {dist: fixed, value: 56.4, status: measured, source: "cytoplasm, magnetic rotational spectroscopy (Dessard et al. 2024, doi:10.1039/d4na00003j)"}
    tau:   {dist: normal, mean: 3.23, sd: 0.27, trunc: [2.0, 4.5], status: measured, source: "Dessard et al. 2024"}
  MDA-MB-231:
    group: tumour
    D:     {dist: normal, mean: 17.24, cv: 0.10, trunc: [12.0, 24.0], status: "measured (mean); declared (cv)", source: "Hu et al. 2018"}
    an_a:  {dist: normal, mean: 0.50, sd: 0.05, trunc: [0.40, 0.60], status: transferred, source: "Wang et al. 2023"}
    E_app: {dist: lognormal, mean: 1.527, cv: 0.25, trunc: [0.5, 5.0], status: "measured (mean); declared (cv)", source: "Lim et al. 2020"}
    gamma: {dist: fixed, value: 0.0, status: declared, source: "no measurement"}
    eta:   {dist: fixed, value: 10.7, status: measured, source: "Dessard et al. 2024"}
    tau:   {dist: normal, mean: 0.57, sd: 0.10, trunc: [0.3, 0.9], status: measured, source: "Dessard et al. 2024"}
  SK-BR-3:
    group: tumour
    D:     {dist: normal, mean: 20.0, cv: 0.10, trunc: [14.0, 26.0], status: transferred, source: "panel value (Lim et al. 2020); imaging flow cytometry gives 18.0 +/- 3.7 um (Sebastian et al. 2021)"}
    an_a:  {dist: normal, mean: 0.50, sd: 0.05, trunc: [0.40, 0.60], status: transferred, source: "Wang et al. 2023; measured 0.69 by Sebastian et al. 2021"}
    E_app: {dist: lognormal, mean: 2.772, cv: 0.25, trunc: [0.8, 8.0], status: "measured (mean); declared (cv)", source: "Lim et al. 2020"}
    gamma: {dist: fixed, value: 0.0, status: declared, source: "no measurement"}
    eta:   {dist: fixed, value: 41.6, status: transferred, source: "MCF-10A (Dessard et al. 2024)"}
    tau:   {dist: normal, mean: 1.90, sd: 0.75, trunc: [0.57, 3.23], status: declared, source: "bracket of the measured panel"}
  patient_breast_CTC:
    group: tumour
    D:     {dist: normal, mean: 11.5, cv: 0.20, trunc: [6.0, 24.0], status: "derived (median); declared (cv)", source: "CellSearch median 12.4 um in 71 612 CTCs (Mendelaar et al. 2021, doi:10.1002/1878-0261.12802), taken to suspension with two internal ratios of the same study (x8.4/9.4 -> 11.1 um; x17.48/18.4 -> 11.8 um); midpoint used. cv declared (SK-BR-3: 21%, Sebastian et al. 2021); sensitivity 15-25%"}
    an_a:  {dist: normal, mean: 0.69, sd: 0.06, trunc: [0.50, 0.85], status: transferred, source: "SK-BR-3, nuclear/cell diameter 12.5/18.0 (Sebastian et al. 2021, doi:10.1371/journal.pone.0253439)"}
    E_app: {dist: lognormal, mean: 1.527, cv: 0.50, trunc: [0.2, 6.0], status: "transferred; NOT MEASURED in patient CTCs", source: "MDA-MB-231, the softest line (Lim et al. 2020); wide cv because some patient CTCs resemble blood cells mechanically (Shaw Bagnall et al. 2015, doi:10.1038/srep18542)"}
    gamma: {dist: fixed, value: 0.0, status: declared, source: "no measurement"}
    eta:   {dist: fixed, value: 10.7, status: transferred, source: "MDA-MB-231 (Dessard et al. 2024)"}
    tau:   {dist: lognormal, mean: 0.57, cv: 0.5, trunc: [0.1, 3.23], status: transferred, source: "MDA-MB-231 (Dessard et al. 2024)"}
  HL-60:
    group: blast
    D:     {dist: normal, mean: 17.0, cv: 0.08, trunc: [12.0, 22.0], status: measured, source: "Fregin et al. 2019"}
    an_a:  {dist: normal, mean: 0.70, sd: 0.05, trunc: [0.55, 0.85], status: measured, source: "49 +/- 6% of area (Rosenbluth et al. 2006)"}
    E_app: {dist: lognormal, mean: 0.400, cv: 0.25, trunc: [0.15, 1.2], status: measured, source: "dRT-DC (Fregin et al. 2019)"}
    gamma: {dist: fixed, value: 0.0, status: declared, source: "no measurement"}
    eta:   {dist: fixed, value: 3.43, status: measured, source: "whole-cell Kelvin-Voigt (Fregin et al. 2019)"}
    tau:   {dist: fixed, value: 0.008575, status: measured, source: "Fregin et al. 2019"}
  Jurkat:
    group: blast
    D:     {dist: normal, mean: 11.5, sd: 1.5, trunc: [8.0, 16.0], status: measured, source: "Rosenbluth et al. 2006"}
    an_a:  {dist: normal, mean: 0.742, sd: 0.05, trunc: [0.62, 0.86], status: measured, source: "55 +/- 8% of area (Rosenbluth et al. 2006)"}
    E_app: {dist: lognormal, mean: 0.400, cv: 0.30, trunc: [0.15, 1.5], status: transferred, source: "HL-60 dRT-DC"}
    gamma: {dist: fixed, value: 0.0, status: declared, source: "no measurement"}
    eta:   {dist: fixed, value: 3.43, status: transferred, source: "HL-60"}
