# =============================================================================
# Modelo poblacional de celulas: distribuciones por subpoblacion.
#
# Cada parametro lleva:  dist (normal | lognormal | fijo), media, cv o sd,
# truncamiento [min, max], estado (medido | transferido | declarado) y fuente.
#   medido      : medido en ESA poblacion
#   transferido : medido en OTRA poblacion y asignado a esta
#   declarado   : eleccion del modelo sin medida directa
#
# Unidades: diametros en um, E_app en kPa, tension cortical en mN/m (= 1000 pN/um),
# viscosidad en Pa s, tau en s.
#
# OJO: este archivo es DATO DE ENTRADA.  Cualquier cambio cambia el hash de la
# corrida (manifest.json) y la hace distinta a efectos de reproducibilidad.
# =============================================================================

version: 1

# Fraccion del diferencial leucocitario en donantes sanos (pesos del analisis,
# no del muestreo FEM).  Chavez-Gonzalez et al. 2023, Biochem Med 33:132-41,
# doi:10.11613/bm.2023.020701.
diferencial:
  neutrofilo: 0.5635
  linfocito:  0.3286
  monocito:   0.0804
  eosinofilo: 0.0209
  basofilo:   0.0066

# Constantes de modelo heredadas del manuscrito (no son de poblacion).
modelo:
  K_E: 2.608          # E_app = K_E * Gs / a  (calibrado con Pi = 0.10; manuscrito Sect. 2.5)
  Pi: 0.10            # G_cyt * a / Gs  (regularizacion declarada; Sect. 2.3)
  C_skalak: 10.0      # Ks/Gs = 1 + 2C ; transferido (Wang et al. 2023), rango [2.4, 37]
  r_nuc: 2.0          # rigidez nucleo/citoplasma; transferido (Ofek 2009; Guilak 2000), rango [1.4, 4]
  r_env: 2.0          # Gs envoltura / Gs cortex; transferido (Wang et al. 2023), rango [2, 8]

poblaciones:

  # ------------------------------------------------------------- leucocitos
  neutrofilo:
    grupo: leucocito
    D:     {dist: normal, media: 8.40, sd: 0.60, trunc: [6.5, 10.5], estado: medido,
            fuente: "Coulter 8.4 um (Downey et al. 1990, doi:10.1152/jappl.1990.69.5.1767); SD 0.6 um (Rosenbluth et al. 2006, doi:10.1529/biophysj.105.067496)"}
    an_a:  {dist: normal, media: 0.625, sd: 0.08, trunc: [0.45, 0.80], estado: medido,
            fuente: "39 +/- 11 % del area de seccion (Rosenbluth et al. 2006)"}
    E_app: {dist: lognormal, media: 0.43, cv: 0.25, trunc: [0.15, 1.2], estado: "medido (media); declarado (cv)",
            fuente: "granulocito, dRT-DC 0.43 [0.38-0.48] kPa (Fregin et al. 2019, doi:10.1038/s41467-019-08370-3); dispersion celula a celula no recuperada -> cv declarado"}
    gamma: {dist: normal, media: 0.037, sd: 0.0048, trunc: [0.005, 0.08], estado: medido,
            fuente: "37.0 +/- 4.8 pN/um, aspiracion microfluidica (Guo et al. 2012, Lab Chip, doi:10.1039/c2lc40205j); a 37 C cae a ~6 pN/um (Liu et al., profiles.wustl.edu) -> ver nota temperatura"}
    eta:   {dist: lognormal, media: 150.0, cv: 0.35, trunc: [50, 600], estado: medido,
            fuente: "~100-200 Pa s, micropipeta (Evans & Yeung 1989, doi:10.1016/S0006-3495(89)82660-8; Hochmuth 2000 revision)"}
    tau:   {dist: lognormal, media: 0.008575, cv: 0.5, trunc: [0.001, 3.23], estado: transferido,
            fuente: "anclaje de celula entera HL-60 dRT-DC (Fregin et al. 2019); manuscrito Sect. 3.3.1"}

  linfocito:
    grupo: leucocito
    D:     {dist: normal, media: 6.05, sd: 0.44, trunc: [4.8, 7.8], estado: "medido (media); transferido (sd)",
            fuente: "6.05 um extincion axial (Downey et al. 1990); sd: CV del neutrofilo 7.2 % (eleccion conservadora: maximiza solapamiento)"}
    an_a:  {dist: normal, media: 0.763, sd: 0.05, trunc: [0.65, 0.88], estado: medido,
            fuente: "nucleo 44.4 % del volumen (Schmid-Schonbein et al. 1980, doi:10.1182/blood.v56.5.866.866)"}
    E_app: {dist: lognormal, media: 0.62, cv: 0.25, trunc: [0.2, 1.6], estado: "medido (PBMC); declarado (cv)",
            fuente: "PBMC dRT-DC 0.62 [0.58-0.66] kPa (Fregin et al. 2019). Bufi et al. 2015 (doi:10.1016/j.bpj.2015.03.047) dan T CD4+ E = 85 +/- 5 Pa por microplacas: otra tecnica, no se mezcla"}
    gamma: {dist: normal, media: 0.0747, sd: 0.0098, trunc: [0.02, 0.15], estado: medido,
            fuente: "74.7 +/- 9.8 pN/um, misma tecnica que el neutrofilo (Guo et al. 2012)"}
    eta:   {dist: lognormal, media: 150.0, cv: 0.5, trunc: [30, 1500], estado: transferido,
            fuente: "sin medida recuperada para linfocito en reposo; transferido del neutrofilo con cv amplio. T activadas: ~870 Pa s caracteristica (Frontiers Bioeng 2023, doi:10.3389/fbioe.2023.1175570), no aplicable a reposo"}
    tau:   {dist: lognormal, media: 0.008575, cv: 0.5, trunc: [0.001, 3.23], estado: transferido,
            fuente: "igual que neutrofilo"}

  monocito:
    grupo: leucocito
    D:     {dist: normal, media: 8.79, sd: 0.57, trunc: [7.0, 11.0], estado: medido,
            fuente: "Coulter 8.79 um, rango 7.72-9.99 tomado como +/-2 SD (Downey et al. 1990)"}
    an_a:  {dist: normal, media: 0.638, sd: 0.06, trunc: [0.48, 0.80], estado: medido,
            fuente: "nucleo 25.9 % del volumen (Schmid-Schonbein et al. 1980)"}
    E_app: {dist: lognormal, media: 0.62, cv: 0.30, trunc: [0.2, 2.0], estado: "transferido (PBMC); declarado (cv)",
            fuente: "PBMC dRT-DC (Fregin et al. 2019). Bufi et al. 2015: monocito G' = 520 Pa frente a T 85 Pa (microplacas) -> el monocito podria ser mas rigido que el linfocito; usar escenario 'monocito_rigido' en analisis de sensibilidad"}
    gamma: {dist: normal, media: 0.037, sd: 0.018, trunc: [0.005, 0.12], estado: transferido,
            fuente: "sin valor numerico recuperado (Hochmuth, Needham & Ting-Beall 1991 lo midieron, no recuperado); transferido del neutrofilo con sd del 50 %"}
    eta:   {dist: lognormal, media: 150.0, cv: 0.5, trunc: [30, 1500], estado: transferido, fuente: "neutrofilo"}
    tau:   {dist: lognormal, media: 0.008575, cv: 0.5, trunc: [0.001, 3.23], estado: transferido, fuente: "neutrofilo"}

  eosinofilo:
    grupo: leucocito
    D:     {dist: normal, media: 8.40, sd: 0.60, trunc: [6.5, 10.5], estado: transferido, fuente: "neutrofilo"}
    an_a:  {dist: normal, media: 0.625, sd: 0.08, trunc: [0.45, 0.80], estado: transferido, fuente: "neutrofilo"}
    E_app: {dist: lognormal, media: 0.43, cv: 0.25, trunc: [0.15, 1.2], estado: transferido, fuente: "granulocito"}
    gamma: {dist: normal, media: 0.037, sd: 0.0048, trunc: [0.005, 0.08], estado: transferido, fuente: "neutrofilo"}
    eta:   {dist: lognormal, media: 150.0, cv: 0.35, trunc: [50, 600], estado: transferido, fuente: "neutrofilo"}
    tau:   {dist: lognormal, media: 0.008575, cv: 0.5, trunc: [0.001, 3.23], estado: transferido, fuente: "neutrofilo"}

  basofilo:
    grupo: leucocito
    D:     {dist: normal, media: 8.40, sd: 0.60, trunc: [6.5, 10.5], estado: transferido, fuente: "neutrofilo"}
    an_a:  {dist: normal, media: 0.625, sd: 0.08, trunc: [0.45, 0.80], estado: transferido, fuente: "neutrofilo"}
    E_app: {dist: lognormal, media: 0.43, cv: 0.25, trunc: [0.15, 1.2], estado: transferido, fuente: "granulocito"}
    gamma: {dist: normal, media: 0.037, sd: 0.0048, trunc: [0.005, 0.08], estado: transferido, fuente: "neutrofilo"}
    eta:   {dist: lognormal, media: 150.0, cv: 0.35, trunc: [50, 600], estado: transferido, fuente: "neutrofilo"}
    tau:   {dist: lognormal, media: 0.008575, cv: 0.5, trunc: [0.001, 3.23], estado: transferido, fuente: "neutrofilo"}

  # ------------------------------------------------------------- tumorales
  MCF-7:
    grupo: tumoral
    D:     {dist: normal, media: 17.48, cv: 0.10, trunc: [12.0, 24.0], estado: "medido (media); declarado (cv)",
            fuente: "radio 8.74 um en microcanal (Hu et al. 2018, doi:10.1039/c7ra10750a); cv declarado (manuscrito Sect. 3.1)"}
    an_a:  {dist: normal, media: 0.50, sd: 0.05, trunc: [0.40, 0.60], estado: transferido,
            fuente: "ajustes HL-60/PC-3/K-562 (Wang et al. 2023; Lu et al. 2025)"}
    E_app: {dist: lognormal, media: 2.650, cv: 0.25, trunc: [0.8, 8.0], estado: "medido (media); declarado (cv)",
            fuente: "pinzas acusticas SBAT (Lim et al. 2020, doi:10.1038/s41378-020-0150-6)"}
    gamma: {dist: fijo, valor: 0.0, estado: declarado, fuente: "sin medida para lineas de mama"}
    eta:   {dist: fijo, valor: 56.4, estado: medido, fuente: "MRS citoplasma (Dessard et al. 2024, doi:10.1039/d4na00003j)"}
    tau:   {dist: normal, media: 3.23, sd: 0.27, trunc: [2.0, 4.5], estado: medido, fuente: "Dessard et al. 2024"}

  MDA-MB-231:
    grupo: tumoral
    D:     {dist: normal, media: 17.24, cv: 0.10, trunc: [12.0, 24.0], estado: "medido (media); declarado (cv)", fuente: "Hu et al. 2018"}
    an_a:  {dist: normal, media: 0.50, sd: 0.05, trunc: [0.40, 0.60], estado: transferido, fuente: "Wang et al. 2023"}
    E_app: {dist: lognormal, media: 1.527, cv: 0.25, trunc: [0.5, 5.0], estado: "medido (media); declarado (cv)", fuente: "Lim et al. 2020"}
    gamma: {dist: fijo, valor: 0.0, estado: declarado, fuente: "sin medida"}
    eta:   {dist: fijo, valor: 10.7, estado: medido, fuente: "Dessard et al. 2024"}
    tau:   {dist: normal, media: 0.57, sd: 0.10, trunc: [0.3, 0.9], estado: medido, fuente: "Dessard et al. 2024"}

  SK-BR-3:
    grupo: tumoral
    D:     {dist: normal, media: 20.0, cv: 0.10, trunc: [14.0, 26.0], estado: transferido, fuente: "valor agregado del panel (Lim et al. 2020)"}
    an_a:  {dist: normal, media: 0.50, sd: 0.05, trunc: [0.40, 0.60], estado: transferido, fuente: "Wang et al. 2023"}
    E_app: {dist: lognormal, media: 2.772, cv: 0.25, trunc: [0.8, 8.0], estado: "medido (media); declarado (cv)", fuente: "Lim et al. 2020"}
    gamma: {dist: fijo, valor: 0.0, estado: declarado, fuente: "sin medida"}
    eta:   {dist: fijo, valor: 41.6, estado: transferido, fuente: "MCF-10A (Dessard et al. 2024)"}
    tau:   {dist: normal, media: 1.90, sd: 0.75, trunc: [0.57, 3.23], estado: declarado, fuente: "bracket del panel medido"}

  # ------------------------------------------------- CTC de pacientes
  CTC_mama_paciente:
    grupo: tumoral
    D:     {dist: normal, media: 11.5, cv: 0.20, trunc: [6.0, 24.0], estado: "derivado (mediana); declarado (cv)",
            fuente: "mediana CellSearch 12.4 um en 71 612 CTC (Mendelaar et al. 2021, doi:10.1002/1878-0261.12802), llevada a suspension con dos cocientes internos del estudio: x8.4/9.4 (leucocitos) = 11.1 um y x17.48/18.4 (lineas) = 11.8 um; se usa el punto medio. cv no recuperado: 20 % declarado (SK-BR-3 mide 21 %, Sebastian et al. 2021); sensibilidad 15-25 %"}
    an_a:  {dist: normal, media: 0.69, sd: 0.06, trunc: [0.50, 0.85], estado: transferido,
            fuente: "SK-BR-3, diametro nuclear/celular 12.5/18.0 por citometria de imagen (Sebastian et al. 2021, doi:10.1371/journal.pone.0253439); lineas malignas ~0.6-0.7"}
    E_app: {dist: lognormal, media: 1.527, cv: 0.50, trunc: [0.2, 6.0], estado: "transferido; NO MEDIDO en CTC de paciente",
            fuente: "MDA-MB-231, la linea mas blanda (Lim et al. 2020); cv amplio porque algunas CTC de paciente se parecen mecanicamente a celulas sanguineas (Shaw Bagnall et al. 2015, doi:10.1038/srep18542)"}
    gamma: {dist: fijo, valor: 0.0, estado: declarado, fuente: "sin medida"}
    eta:   {dist: fijo, valor: 10.7, estado: transferido, fuente: "MDA-MB-231 (Dessard et al. 2024)"}
    tau:   {dist: lognormal, media: 0.57, cv: 0.5, trunc: [0.1, 3.23], estado: transferido, fuente: "MDA-MB-231 (Dessard et al. 2024)"}

  # ------------------------------------------------- blastos (referencia)
  HL-60:
    grupo: blasto
    D:     {dist: normal, media: 17.0, cv: 0.08, trunc: [12.0, 22.0], estado: medido, fuente: "Fregin et al. 2019 (configuracion dRT-DC)"}
    an_a:  {dist: normal, media: 0.70, sd: 0.05, trunc: [0.55, 0.85], estado: medido, fuente: "49 +/- 6 % del area (Rosenbluth et al. 2006)"}
    E_app: {dist: lognormal, media: 0.400, cv: 0.25, trunc: [0.15, 1.2], estado: medido, fuente: "dRT-DC (Fregin et al. 2019)"}
    gamma: {dist: fijo, valor: 0.0, estado: declarado, fuente: "sin medida"}
    eta:   {dist: fijo, valor: 3.43, estado: medido, fuente: "Kelvin-Voigt celula entera (Fregin et al. 2019)"}
    tau:   {dist: fijo, valor: 0.008575, estado: medido, fuente: "Fregin et al. 2019"}

  Jurkat:
    grupo: blasto
    D:     {dist: normal, media: 11.5, sd: 1.5, trunc: [8.0, 16.0], estado: medido, fuente: "Rosenbluth et al. 2006"}
    an_a:  {dist: normal, media: 0.742, sd: 0.05, trunc: [0.62, 0.86], estado: medido, fuente: "55 +/- 8 % del area (Rosenbluth et al. 2006)"}
    E_app: {dist: lognormal, media: 0.400, cv: 0.30, trunc: [0.15, 1.5], estado: transferido, fuente: "HL-60 dRT-DC; Bufi et al. 2015 dan 90 Pa por otra tecnica"}
    gamma: {dist: fijo, valor: 0.0, estado: declarado, fuente: "sin medida"}
    eta:   {dist: fijo, valor: 3.43, estado: transferido, fuente: "HL-60"}
    tau:   {dist: fijo, valor: 0.008575, estado: transferido, fuente: "HL-60"}

notas:
  temperatura: >
    La tension cortical del neutrofilo cae de ~23 pN/um a temperatura ambiente a ~6 pN/um a 37 C
    (Liu et al., micropipeta a 37 C). Los demas valores son de temperatura ambiente. Declarar la
    temperatura del ensayo y, si es 37 C, usar el escenario 'gamma_37C' del analisis.
  gamma_en_FEM: >
    gamma solo entra en el FEM si config.modelo.usar_gamma = true. Por defecto se mantiene la
    calibracion del manuscrito (gamma = 0, K_E = 2.608) y gamma se usa en la cota analitica de gota
    liquida  dP = 2 gamma (1/R_p - 1/R_c)  como contraste independiente.
