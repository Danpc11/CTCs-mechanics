# Corrida de produccion para el servidor (40 nucleos, 250 GB).
# Aperturas de 5 a 15 um cada 0.5 um, con 8, 10 y 12 um incluidos de forma explicita.
nombre: completo
semilla: 20261015                  # NO cambiar entre reanudaciones
salida: resultados/completo
datos: {poblaciones: data/poblaciones.yaml, materiales: data/materiales.yaml}
poblaciones:
  neutrofilo: 96
  linfocito: 64
  monocito: 64
  eosinofilo: 32
  basofilo: 16
  MCF-7: 96
  MDA-MB-231: 96
  SK-BR-3: 64
  HL-60: 48
  Jurkat: 48
dispositivos: [membrana_PC, membrana_PET, membrana_PDMS, canal_PDMS, canal_PMMA]
aperturas_um: {inicio: 5.0, fin: 15.0, paso: 0.5, extra: [8.0, 10.0, 12.0]}
modelo:
  hrel: 10.0                # a/h; ver configs/convergencia_malla.yaml
  kn_f: 200.0               # penalizacion numerica (manuscrito)
  conf_max_intento: 2.4     # se INTENTA llegar hasta a/R = 2.4; validado solo hasta 1.636
  usar_gamma: false         # true = tension cortical en el FEM (rompe la calibracion K_E)
  pared_compliante: true    # rigidez de pared del material en serie con la penalizacion
reduccion: {l_factor: 1.0}
ejecucion: {workers: 40, tareas_por_proceso: 25}
